name: Scheduled Repository Maintenance

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify core repository structure
        run: |
          test -f index.html
          test -f css/main.css
          test -f SECURITY.md
          test -d img
          echo "Repository structure check passed."